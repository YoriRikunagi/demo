<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Сборочные чертежи из модели</title>
<style>
:root{--bg:#e9eaee;--ink:#15171a;--mut:#667;--acc:#1f6feb;--card:#fff;--bd:#c9ccd3}
@media (prefers-color-scheme:dark){:root{--bg:#16181c;--ink:#e8e8e8;--mut:#9aa;--acc:#5aa2ff;--card:#21242a;--bd:#3a3e46}}
*{box-sizing:border-box}body{margin:0;font:14px/1.45 system-ui,sans-serif;background:var(--bg);color:var(--ink)}
header{padding:12px 16px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;background:var(--card);border-bottom:1px solid var(--bd);position:sticky;top:0;z-index:5}
h1{font-size:16px;margin:0}
.bar{display:flex;gap:8px;flex-wrap:wrap}
button,.btn{font:inherit;padding:7px 12px;border:1px solid var(--bd);border-radius:8px;background:var(--card);color:var(--ink);cursor:pointer}
button.on{outline:2px solid var(--acc)}button.p{background:var(--acc);color:#fff;border-color:var(--acc)}
main{display:grid;grid-template-columns:270px 1fr;gap:14px;padding:14px;align-items:start}
@media(max-width:900px){main{grid-template-columns:1fr}}
aside{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:12px;position:sticky;top:64px}
@media(max-width:900px){aside{position:static}}
aside h3{margin:12px 0 6px;font-size:12px;color:var(--mut);text-transform:uppercase}aside h3:first-child{margin-top:0}
label{display:flex;gap:8px;align-items:center;padding:2px 0}
.hint{font-size:12px;color:var(--mut);margin:8px 0 0}
#toc a{display:block;color:var(--ink);text-decoration:none;font-size:13px;padding:1px 0}#toc a:hover{color:var(--acc)}
#wrap{overflow:auto}
textarea{width:100%;height:120px;font:11px monospace;display:none;margin-top:8px}
@media print{header,aside{display:none}main{display:block;padding:0}body{background:#fff}#wrap{overflow:visible}.sheet{zoom:1!important}}
</style>
<style id="sheetcss"></style>
</head>
<body>
<header>
  <h1 id="ttl">Сборочные чертежи из модели</h1>
  <div class="bar">
    <button id="bNote" title="Клик по листу ставит пометку, перетаскивание двигает, двойной клик удаляет">Пометки</button>
    <button id="bEdit" title="Клик по названию, количеству, длине и ширине в спецификации — правка">Правка спецификации</button>
    <button id="bJson">JSON</button>
    <label class="btn"><input type="file" id="file" accept=".json,application/json" hidden>Загрузить модель</label>
    <button class="p" id="bPdf">Сохранить в PDF</button>
  </div>
</header>
<main>
<aside>
  <h3>Состав комплекта</h3>
  <label><input type="checkbox" id="cDetail"> Детальные листы (присадка, размеры)</label>
  <p class="hint">Лист на каждую деталь: контур с размерами, кромка красным, отверстия с координатами.</p>
  <h3>Листы</h3>
  <div id="toc"></div>
  <h3>Данные</h3>
  <p class="hint" id="src"></p>
  <p class="hint">Модель читается из JSON (схема в SCHEMA.md). Выгрузку из Базиса сюда подаёт отдельный модуль, он пока не написан.</p>
  <textarea id="ta" spellcheck="false"></textarea>
  <button id="bApply" style="display:none;margin-top:6px">Применить JSON</button>
</aside>
<div id="wrap"><div id="out"></div></div>
</main>
<script src="sheets.js"></script>
<script>
const $=id=>document.getElementById(id);
document.getElementById('sheetcss').textContent=Sheets.css;
let model=null,srcName='model.example.json';
const KEY=()=>'bz-notes:'+(model&&model.order);
let notes={};
try{notes=JSON.parse(localStorage.getItem(KEY())||'{}')}catch(e){}
function saveNotes(){try{localStorage.setItem(KEY(),JSON.stringify(notes))}catch(e){}}

function draw(){
  const r=Sheets.render(model,{detail:$('cDetail').checked});
  $('out').innerHTML=r.html;
  $('ttl').textContent=model.order+' · сборочные чертежи';
  $('toc').innerHTML=r.sheets.map((s,i)=>'<a href="#'+s.id+'">'+(i+1)+'. '+Sheets.esc(s.title)+'</a>').join('');
  $('src').textContent='Источник: '+srcName+(model.date?', дата '+model.date:'');
  fit();
  document.querySelectorAll('.sheet').forEach(sh=>{(notes[sh.id]||[]).forEach(n=>addNote(sh,n))});
}
function fit(){ // масштаб листов под ширину окна на экране
  const w=$('wrap').clientWidth, sw=793; // 210мм ≈ 793px
  const z=Math.min(1,(w-8)/sw);
  document.querySelectorAll('.sheet').forEach(s=>s.style.zoom=z);
}
addEventListener('resize',fit);
addEventListener('beforeprint',()=>document.querySelectorAll('.sheet').forEach(s=>s.style.zoom=1));
addEventListener('afterprint',fit);

/* пометки */
function addNote(sh,n){
  const d=document.createElement('div');d.className='note';d.contentEditable='true';d.textContent=n.t;
  d.style.left=n.x+'%';d.style.top=n.y+'%';
  const arr=notes[sh.id]=notes[sh.id]||[];
  if(!arr.includes(n))arr.push(n);
  d.onblur=()=>{n.t=d.textContent;saveNotes()};
  d.ondblclick=e=>{e.stopPropagation();arr.splice(arr.indexOf(n),1);d.remove();saveNotes()};
  d.onpointerdown=e=>{
    if(document.activeElement===d)return;
    const fr=sh.querySelector('.frame').getBoundingClientRect();
    const mv=ev=>{n.x=Math.max(0,Math.min(95,(ev.clientX-fr.left)/fr.width*100));n.y=Math.max(0,Math.min(97,(ev.clientY-fr.top)/fr.height*100));d.style.left=n.x+'%';d.style.top=n.y+'%'};
    const up=()=>{removeEventListener('pointermove',mv);removeEventListener('pointerup',up);saveNotes()};
    addEventListener('pointermove',mv);addEventListener('pointerup',up);
  };
  sh.querySelector('.notes').appendChild(d);return d;
}
$('out').addEventListener('click',e=>{
  if(!document.body.classList.contains('noting')||e.target.closest('.note'))return;
  const sh=e.target.closest('.sheet');if(!sh)return;
  const fr=sh.querySelector('.frame').getBoundingClientRect();
  const n={x:(e.clientX-fr.left)/fr.width*100,y:(e.clientY-fr.top)/fr.height*100,t:'Пометка'};
  const d=addNote(sh,n);d.focus();document.getSelection().selectAllChildren(d);saveNotes();
});
$('bNote').onclick=()=>{document.body.classList.toggle('noting');$('bNote').classList.toggle('on')};

/* правка элементов спецификации */
$('bEdit').onclick=()=>{
  const on=document.body.classList.toggle('editing');$('bEdit').classList.toggle('on',on);
  document.querySelectorAll('td.ce').forEach(td=>td.contentEditable=on?'true':'false');
};
$('out').addEventListener('focusout',e=>{
  const td=e.target.closest&&e.target.closest('td.ce');if(!td||!document.body.classList.contains('editing'))return;
  let b;(function f(a){a.forEach(x=>{if(x.id===td.dataset.b)b=x;f(x.children||[])})})(model.blocks);
  const p=b&&b.panels[+td.dataset.i];if(!p)return;
  const f=td.dataset.f;let v=td.textContent.trim();
  if(['l','w','qty'].includes(f))v=parseFloat(v.replace(',','.'))||0;
  if(p[f]===v||(f==='groove'&&!v&&!p[f]))return;
  p[f]=v;
  const sc=scrollY;draw();scrollTo(0,sc);
  if(document.body.classList.contains('editing'))document.querySelectorAll('td.ce').forEach(t=>t.contentEditable='true');
});

$('out').addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.closest('td.ce')){e.preventDefault();e.target.closest('td.ce').blur()}});

/* данные */
function load(m,name){model=m;srcName=name;try{notes=JSON.parse(localStorage.getItem(KEY())||'{}')}catch(e){notes={}};draw()}
$('cDetail').onchange=()=>{draw();if(document.body.classList.contains('editing'))document.querySelectorAll('td.ce').forEach(t=>t.contentEditable='true')};
$('file').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{load(JSON.parse(await f.text()),f.name)}catch(x){alert('Не удалось прочитать JSON: '+x.message)}};
$('bJson').onclick=()=>{const t=$('ta'),a=$('bApply'),on=t.style.display!=='block';t.style.display=a.style.display=on?'block':'none';if(on)t.value=JSON.stringify(model,(k,v)=>k==='_edgeNote'?undefined:v,1)};
$('bApply').onclick=()=>{try{load(JSON.parse($('ta').value),'введённый JSON')}catch(x){alert('Ошибка JSON: '+x.message)}};
$('bPdf').onclick=()=>print();
fetch('model.example.json').then(r=>r.json()).then(m=>load(m,'model.example.json (пример по образцу «Стол горка»)')).catch(e=>{$('out').textContent='Не удалось загрузить model.example.json: '+e});
</script>
</body>
</html>
